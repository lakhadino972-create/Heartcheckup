<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HeartCheck – Heart disease risk estimate</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600&family=Sora:wght@600;700&display=swap" rel="stylesheet">

<style>
  :root {
    --ink: #12303a;
    --muted: #5b7480;
    --line: #d5e2e6;
    --bg: #eaf2f3;
    --surface: #ffffff;
    --teal: #0e7c86;
    --teal-deep: #0f3b45;
    --mint: #7fe3d2;
    --risk: #d64550;
    --risk-soft: #fdecee;
    --ok: #1f8f63;
    --ok-soft: #e6f6ef;
    --radius: 14px;
    --font-head: "Sora", "Segoe UI", system-ui, sans-serif;
    --font-body: "Figtree", "Segoe UI", system-ui, sans-serif;
  }

  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    min-height: 100vh;
    font-family: var(--font-body);
    font-size: 16px;
    line-height: 1.5;
    color: var(--ink);
    background: var(--bg);
  }
  h1, h2, h3 { font-family: var(--font-head); line-height: 1.2; margin: 0; }
  p { margin: 0; }
  button, input { font: inherit; color: inherit; }

  :focus-visible { outline: 3px solid var(--teal); outline-offset: 2px; }

  /* ---------- Layout ---------- */
  .app {
    display: grid;
    grid-template-columns: 360px 1fr;
    min-height: 100vh;
  }

  /* ---------- Side panel ---------- */
  .side {
    background: var(--teal-deep);
    color: #e8f6f5;
    padding: 40px 36px;
    display: flex;
    flex-direction: column;
    gap: 32px;
    position: sticky;
    top: 0;
    height: 100vh;
  }
  .brand { font-family: var(--font-head); font-weight: 700; font-size: 20px; display: flex; align-items: center; gap: 10px; }
  .brand svg { flex: none; }
  .side h1 { font-size: 28px; color: #fff; }
  .side .lead { margin-top: 12px; color: #b9d6d8; max-width: 30ch; }

  .steps { list-style: none; margin: 0; padding: 0; display: grid; gap: 14px; }
  .steps li {
    display: flex; align-items: center; gap: 12px;
    color: #8fb3b7; font-weight: 500;
    transition: color .2s;
  }
  .steps .dot {
    width: 28px; height: 28px; border-radius: 50%;
    border: 2px solid #3d6c74;
    display: grid; place-items: center;
    font-size: 13px; font-weight: 600;
    transition: all .2s;
  }
  .steps li.current { color: #fff; }
  .steps li.current .dot { border-color: var(--mint); color: var(--mint); }
  .steps li.done { color: #cfe8e8; }
  .steps li.done .dot { background: var(--mint); border-color: var(--mint); color: var(--teal-deep); }

  .ecg { margin-top: auto; }
  .ecg svg { width: 100%; height: auto; display: block; overflow: visible; }
  .ecg .track { stroke: #2b5861; }
  .ecg .trace {
    stroke: var(--mint);
    stroke-dasharray: 1;
    stroke-dashoffset: var(--off, 1);
    transition: stroke-dashoffset .8s ease;
  }

  /* ---------- Main ---------- */
  .main { padding: 48px 32px; display: flex; justify-content: center; align-items: flex-start; }
  .card {
    width: 100%;
    max-width: 680px;
    background: var(--surface);
    border-radius: 20px;
    padding: 40px;
    box-shadow: 0 1px 2px rgba(15, 59, 69, .06), 0 12px 32px rgba(15, 59, 69, .08);
  }
  .step-head h2 { font-size: 26px; }
  .step-head p { color: var(--muted); margin-top: 6px; }

  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 24px 20px; margin-top: 28px; }
  .field { border: 0; padding: 0; margin: 0; min-width: 0; }
  .field.wide { grid-column: 1 / -1; }

  .field label, .field legend { display: block; font-weight: 600; margin-bottom: 6px; padding: 0; }
  .hint { font-size: 14px; color: var(--muted); margin-top: 6px; }
  .field legend + .hint { margin: -2px 0 10px; }

  .input-wrap { position: relative; }
  .input-wrap input {
    width: 100%;
    height: 50px;
    padding: 0 64px 0 14px;
    border: 1.5px solid var(--line);
    border-radius: 10px;
    background: #fff;
    transition: border-color .15s, box-shadow .15s;
  }
  .input-wrap input:hover { border-color: #b4cad0; }
  .input-wrap input:focus { outline: none; border-color: var(--teal); box-shadow: 0 0 0 4px rgba(14, 124, 134, .15); }
  .unit { position: absolute; right: 14px; top: 50%; transform: translateY(-50%); color: var(--muted); font-size: 14px; pointer-events: none; }

  .choices { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
  .choice { position: relative; display: block; margin: 0; font-weight: 400; cursor: pointer; }
  .choice input { position: absolute; opacity: 0; inset: 0; margin: 0; cursor: pointer; }
  .choice span {
    display: block;
    height: 100%;
    padding: 12px 14px;
    border: 1.5px solid var(--line);
    border-radius: 10px;
    font-weight: 600;
    transition: border-color .15s, background .15s;
  }
  .choice small { display: block; margin-top: 2px; font-weight: 400; font-size: 13px; color: var(--muted); line-height: 1.35; }
  .choice:hover span { border-color: #9fbcc3; }
  .choice input:checked + span { border-color: var(--teal); background: #e9f6f7; box-shadow: inset 0 0 0 1px var(--teal); }
  .choice input:focus-visible + span { outline: 3px solid var(--teal); outline-offset: 2px; }

  .field.invalid .input-wrap input { border-color: var(--risk); }
  .error { display: none; margin-top: 6px; font-size: 14px; color: var(--risk); font-weight: 500; }
  .field.invalid .error { display: block; }

  /* ---------- Buttons ---------- */
  .actions { display: flex; justify-content: space-between; gap: 12px; margin-top: 36px; }
  .btn {
    height: 50px; padding: 0 26px;
    border-radius: 10px; border: 1.5px solid transparent;
    font-weight: 600; cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    transition: background .15s, border-color .15s, transform .05s;
  }
  .btn:active { transform: translateY(1px); }
  .btn-primary { background: var(--teal); color: #fff; margin-left: auto; }
  .btn-primary:hover { background: #0b6770; }
  .btn-ghost { background: transparent; border-color: var(--line); color: var(--ink); }
  .btn-ghost:hover { border-color: #9fbcc3; }
  .btn[disabled] { opacity: .7; cursor: progress; }
  .spinner {
    width: 16px; height: 16px; border-radius: 50%;
    border: 2px solid rgba(255,255,255,.4); border-top-color: #fff;
    animation: spin .7s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .alert {
    margin-top: 20px; padding: 12px 14px; border-radius: 10px;
    background: var(--risk-soft); color: #8f1f2a; font-size: 15px;
  }

  /* ---------- Result ---------- */
  .result { text-align: center; }
  .gauge { position: relative; width: 190px; height: 190px; margin: 4px auto 20px; }
  .gauge svg { width: 100%; height: 100%; transform: rotate(-90deg); }
  .gauge .bg { stroke: var(--line); }
  .gauge .fg { stroke-dasharray: 326.7; stroke-dashoffset: 326.7; transition: stroke-dashoffset 1s ease; }
  .gauge .num {
    position: absolute; inset: 0; display: grid; place-items: center;
    font-family: var(--font-head); font-weight: 700; font-size: 38px;
  }
  .gauge .num small { display: block; font-family: var(--font-body); font-weight: 500; font-size: 13px; color: var(--muted); text-align: center; }
  .result h2 { font-size: 26px; }
  .result.high .verdict { color: var(--risk); }
  .result.low .verdict { color: var(--ok); }
  .result .explain { margin: 12px auto 0; max-width: 46ch; color: var(--muted); }
  .badge-demo { display: inline-block; margin-bottom: 14px; padding: 4px 10px; border-radius: 99px; background: #fff4d6; color: #7a5a00; font-size: 13px; font-weight: 600; }
  .notice {
    margin-top: 26px; padding: 14px 16px; text-align: left;
    border-radius: 10px; background: #f3f8f9; border: 1px solid var(--line);
    font-size: 14px; color: var(--muted);
  }
  .result .actions { justify-content: center; flex-wrap: wrap; }
  .result .btn-primary { margin-left: 0; }

  [hidden] { display: none !important; }

  /* ---------- Responsive ---------- */
  @media (max-width: 900px) {
    .app { grid-template-columns: 1fr; }
    .side { position: static; height: auto; padding: 22px 20px 20px; gap: 18px; }
    .side h1, .side .lead { display: none; }
    .steps { grid-template-columns: repeat(3, 1fr); gap: 8px; }
    .steps li { flex-direction: column; text-align: center; gap: 6px; font-size: 13px; }
    .ecg { margin-top: 0; }
    .main { padding: 20px 14px 40px; }
    .card { padding: 26px 20px; }
  }
  @media (max-width: 520px) {
    .grid { grid-template-columns: 1fr; }
  }
  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; animation: none !important; }
  }
</style>
</head>

<body>
<div class="app">

  <!-- ===== Side panel: brand, steps, ECG progress line ===== -->
  <aside class="side">
    <div class="brand">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <path d="M12 21s-7.5-4.6-9.5-9.2C1.2 8.700 3 5.500 6.200 5.500c2 0 3.200 1 3.800 2 .6-1 1.800-2 3.800-2 3.200 0 5 3.200 3.700 6.300C19.500 16.400 12 21 12 21z" fill="#7fe3d2"/>
      </svg>
      HeartCheck
    </div>

    <div>
      <h1>Get a quick heart health estimate</h1>
      <p class="lead">Answer 13 short questions. It takes about two minutes.</p>
    </div>

    <ol class="steps" id="stepList" aria-label="Progress"></ol>

    <div class="ecg" aria-hidden="true">
      <svg viewBox="0 0 320 80" fill="none" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
        <path class="track" d="M0 40H50l8-6 8 6h28l7 6 11-34 13 58 9-30h38l8-8 12 8h30l7 6 11-34 13 58 9-30H320" />
        <path class="trace" id="trace" pathLength="1" d="M0 40H50l8-6 8 6h28l7 6 11-34 13 58 9-30h38l8-8 12 8h30l7 6 11-34 13 58 9-30H320" />
      </svg>
    </div>
  </aside>

  <!-- ===== Main: form + result ===== -->
  <main class="main">
    <div class="card">

      <form id="form" novalidate>
        <div id="panels"></div>
        <p class="alert" id="formError" role="alert" hidden></p>
        <div class="actions">
          <button type="button" class="btn btn-ghost" id="backBtn">Back</button>
          <button type="submit" class="btn btn-primary" id="nextBtn">Next</button>
        </div>
      </form>

      <section class="result" id="result" tabindex="-1" hidden></section>
    </div>
  </main>
</div>

<script>
/* =====================================================================
   SETTINGS — change these two lines to connect your backend
   ===================================================================== */
const API_URL  = "http://127.0.0.1:8000/predict";   // your backend endpoint (POST, JSON)
const USE_DEMO = false;        // true = fake local result so you can preview the UI. false = real predictions from your backend.

/* =====================================================================
   FORM DEFINITION
   Each "id" is the key sent to your backend. Values match the dataset codes.
   ===================================================================== */
const STEPS = [
  {
    title: "About you",
    sub: "Basic details and how your chest feels during activity.",
    fields: [
      { id: "age", label: "Age", type: "number", unit: "years", min: 18, max: 100, placeholder: "e.g. 54" },
      { id: "sex", label: "Sex", type: "choice", options: [
        { value: 1, label: "Male" },
        { value: 0, label: "Female" } ] },
      { id: "chest_pain_type", label: "Chest pain type", type: "choice", options: [
        { value: 1, label: "Typical angina",  desc: "Pressure or tightness when active or stressed" },
        { value: 2, label: "Atypical angina", desc: "Chest pain that doesn't fit the typical pattern" },
        { value: 3, label: "Non-anginal pain", desc: "Chest pain not related to the heart" },
        { value: 4, label: "No symptoms",      desc: "I don't feel chest pain" } ] },
      { id: "exercise_induced_angina", label: "Chest pain during exercise?", type: "choice", options: [
        { value: 1, label: "Yes" },
        { value: 0, label: "No" } ] }
    ]
  },
  {
    title: "Your vitals",
    sub: "Numbers from a recent check-up or a home monitor.",
    fields: [
      { id: "resting_blood_pressure", label: "Resting blood pressure", type: "number", unit: "mm Hg", min: 80, max: 220, placeholder: "e.g. 130", hint: "The top number, measured while resting." },
      { id: "serum_cholestoral", label: "Cholesterol", type: "number", unit: "mg/dl", min: 100, max: 600, placeholder: "e.g. 240", hint: "Total serum cholesterol from a blood test." },
      { id: "max_heart_rate", label: "Maximum heart rate", type: "number", unit: "bpm", min: 60, max: 220, placeholder: "e.g. 150", hint: "Highest rate reached during exercise." },
      { id: "fasting_blood_sugar", label: "Fasting blood sugar above 120 mg/dl?", type: "choice", options: [
        { value: 1, label: "Yes" },
        { value: 0, label: "No" } ] }
    ]
  },
  {
    title: "Test results",
    sub: "These come from an ECG or stress test. Ask your clinic if you're unsure.",
    fields: [
      { id: "resting_ecg", label: "Resting ECG result", type: "choice", options: [
        { value: 0, label: "Normal" },
        { value: 1, label: "ST-T wave abnormality" },
        { value: 2, label: "Left ventricular hypertrophy" } ] },
      { id: "oldpeak", label: "ST depression after exercise", type: "number", unit: "mm", min: 0, max: 7, step: 0.1, placeholder: "e.g. 1.2", hint: "Called “oldpeak” on test reports." },
      { id: "st_segment", label: "Slope of the ST segment at peak exercise", type: "choice", options: [
        { value: 1, label: "Upsloping" },
        { value: 2, label: "Flat" },
        { value: 3, label: "Downsloping" } ] },
      { id: "major_vessels", label: "Major vessels colored by fluoroscopy", type: "choice", options: [
        { value: 0, label: "0" }, { value: 1, label: "1" }, { value: 2, label: "2" }, { value: 3, label: "3" } ] },
      { id: "thal", label: "Thallium stress test result", type: "choice", options: [
        { value: 3, label: "Normal" },
        { value: 6, label: "Fixed defect" },
        { value: 7, label: "Reversible defect" } ] }
    ]
  }
];

/* =====================================================================
   RENDERING
   ===================================================================== */
const $ = (s) => document.querySelector(s);
const panelsEl = $("#panels");
const stepListEl = $("#stepList");
let current = 0;

function fieldHTML(f) {
  const err = `<p class="error" id="${f.id}-err"></p>`;
  const hint = f.hint ? `<p class="hint" id="${f.id}-hint">${f.hint}</p>` : "";

  if (f.type === "number") {
    return `
      <div class="field" data-field="${f.id}">
        <label for="${f.id}">${f.label}</label>
        <div class="input-wrap">
          <input id="${f.id}" name="${f.id}" type="number" inputmode="decimal"
                 min="${f.min}" max="${f.max}" step="${f.step || 1}"
                 placeholder="${f.placeholder || ""}"
                 aria-describedby="${f.id}-hint ${f.id}-err">
          <span class="unit">${f.unit}</span>
        </div>
        ${hint}${err}
      </div>`;
  }

  const options = f.options.map(o => `
    <label class="choice">
      <input type="radio" name="${f.id}" value="${o.value}">
      <span>${o.label}${o.desc ? `<small>${o.desc}</small>` : ""}</span>
    </label>`).join("");

  return `
    <fieldset class="field wide" data-field="${f.id}">
      <legend>${f.label}</legend>
      <div class="choices">${options}</div>
      ${err}
    </fieldset>`;
}

function buildUI() {
  panelsEl.innerHTML = STEPS.map((s, i) => `
    <section class="step" data-step="${i}" ${i ? "hidden" : ""}>
      <div class="step-head">
        <h2>${s.title}</h2>
        <p>${s.sub}</p>
      </div>
      <div class="grid">${s.fields.map(fieldHTML).join("")}</div>
    </section>`).join("");

  stepListEl.innerHTML = STEPS.map((s, i) =>
    `<li data-i="${i}"><span class="dot">${i + 1}</span>${s.title}</li>`).join("");
}

function showStep(i) {
  current = i;
  panelsEl.querySelectorAll(".step").forEach(p => p.hidden = Number(p.dataset.step) !== i);
  $("#backBtn").style.visibility = i === 0 ? "hidden" : "visible";
  $("#nextBtn").textContent = i === STEPS.length - 1 ? "Get my result" : "Next";
  $("#formError").hidden = true;

  stepListEl.querySelectorAll("li").forEach((li, n) => {
    li.classList.toggle("current", n === i);
    li.classList.toggle("done", n < i);
    li.querySelector(".dot").textContent = n < i ? "✓" : n + 1;
  });
  setProgress(i / STEPS.length);
  window.scrollTo({ top: 0, behavior: "smooth" });
}

function setProgress(p) {
  // The ECG line draws itself as you move through the steps.
  $("#trace").style.setProperty("--off", 1 - Math.max(0.06, p));
}

/* =====================================================================
   VALIDATION
   ===================================================================== */
function validateStep(i) {
  let ok = true;
  STEPS[i].fields.forEach(f => {
    const box = panelsEl.querySelector(`[data-field="${f.id}"]`);
    const errEl = $(`#${f.id}-err`);
    let msg = "";

    if (f.type === "number") {
      const raw = $(`#${f.id}`).value.trim();
      const v = Number(raw);
      if (raw === "" || Number.isNaN(v)) msg = "Enter a number.";
      else if (v < f.min || v > f.max) msg = `Enter a value between ${f.min} and ${f.max}.`;
    } else if (!panelsEl.querySelector(`input[name="${f.id}"]:checked`)) {
      msg = "Choose one option.";
    }

    box.classList.toggle("invalid", !!msg);
    errEl.textContent = msg;
    if (msg && ok) {
      (box.querySelector("input") || box).focus();
    }
    if (msg) ok = false;
  });
  return ok;
}

/* =====================================================================
   COLLECT ANSWERS + CALL BACKEND
   ===================================================================== */
function collectAnswers() {
  const data = {};
  STEPS.forEach(s => s.fields.forEach(f => {
    data[f.id] = f.type === "number"
      ? Number($(`#${f.id}`).value)
      : Number(panelsEl.querySelector(`input[name="${f.id}"]:checked`).value);
  }));
  return data;
}

/* Expected response from your backend:
   { "prediction": 1, "probability": 0.82 }
   prediction  → 1 = heart disease likely, 0 = unlikely
   probability → optional, a number from 0 to 1                        */
async function predict(data) {
  if (USE_DEMO) {
    await new Promise(r => setTimeout(r, 900));
    return demoPrediction(data);
  }
  const res = await fetch(API_URL, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(data)
  });
  if (!res.ok) throw new Error("Server error " + res.status);
  return res.json();
}

/* Rough local stand-in so you can preview the UI. NOT a real model. */
function demoPrediction(d) {
  let s = 0;
  if (d.age > 55) s += 1;
  if (d.sex === 1) s += 1;
  if (d.chest_pain_type === 4) s += 2;
  if (d.exercise_induced_angina === 1) s += 1.5;
  if (d.oldpeak > 1.5) s += 1.5;
  s += d.major_vessels;
  if (d.thal === 7) s += 2; else if (d.thal === 6) s += 1;
  if (d.max_heart_rate < 130) s += 1;
  if (d.st_segment >= 2) s += 1;
  const probability = 1 / (1 + Math.exp(-(s - 5) * 0.8));
  return { prediction: probability >= 0.5 ? 1 : 0, probability, demo: true };
}

/* =====================================================================
   RESULT VIEW
   ===================================================================== */
function showResult(r) {
  const high = Number(r.prediction) === 1;
  const hasProb = typeof r.probability === "number";
  const pct = hasProb ? Math.round(r.probability * 100) : null;
  const color = high ? "var(--risk)" : "var(--ok)";

  const gauge = hasProb ? `
    <div class="gauge" role="img" aria-label="Estimated probability ${pct} percent">
      <svg viewBox="0 0 120 120">
        <circle class="bg" cx="60" cy="60" r="52" fill="none" stroke-width="10"/>
        <circle class="fg" id="gaugeFg" cx="60" cy="60" r="52" fill="none" stroke-width="10"
                stroke-linecap="round" stroke="${color}"/>
      </svg>
      <div class="num"><div>${pct}%<small>estimated<br>likelihood</small></div></div>
    </div>` : "";

  $("#result").className = "result " + (high ? "high" : "low");
  $("#result").innerHTML = `
    ${r.demo ? '<span class="badge-demo">Demo result – not from a real model</span>' : ""}
    ${gauge}
    <h2 class="verdict" id="verdict">${high ? "Higher risk of heart disease" : "Lower risk of heart disease"}</h2>
    <p class="explain">${high
      ? "Your answers are similar to patterns often seen in people with heart disease. Please book a visit with a doctor to get checked."
      : "Your answers are less similar to patterns seen in people with heart disease. Keep up regular check-ups and healthy habits."}</p>
    <p class="notice"><strong>This is an estimate, not a diagnosis.</strong> It comes from a statistical model trained on a small dataset. Only a doctor can diagnose heart conditions.</p>
    <div class="actions">
      <button type="button" class="btn btn-ghost" id="editBtn">Edit my answers</button>
      <button type="button" class="btn btn-primary" id="restartBtn">Start over</button>
    </div>`;

  $("#form").hidden = true;
  $("#result").hidden = false;
  $("#result").focus();

  stepListEl.querySelectorAll("li").forEach(li => {
    li.classList.remove("current"); li.classList.add("done");
    li.querySelector(".dot").textContent = "✓";
  });
  setProgress(1);

  if (hasProb) requestAnimationFrame(() => {
    $("#gaugeFg").style.strokeDashoffset = 326.7 * (1 - r.probability);
  });

  $("#editBtn").onclick = () => { $("#result").hidden = true; $("#form").hidden = false; showStep(0); };
  $("#restartBtn").onclick = () => { $("#form").reset(); $("#editBtn").click(); };
}

/* =====================================================================
   EVENTS
   ===================================================================== */
$("#backBtn").addEventListener("click", () => showStep(current - 1));

$("#form").addEventListener("submit", async (e) => {
  e.preventDefault();
  if (!validateStep(current)) return;

  if (current < STEPS.length - 1) { showStep(current + 1); return; }

  const btn = $("#nextBtn");
  const label = btn.textContent;
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span> Checking…';
  $("#formError").hidden = true;

  try {
    showResult(await predict(collectAnswers()));
  } catch (err) {
    console.error(err);
    $("#formError").textContent = "We couldn't reach the prediction service (" + err.message + "). Make sure the backend is running, then try again.";
    $("#formError").hidden = false;
  } finally {
    btn.disabled = false;
    btn.textContent = label;
  }
});

// Clear an error as soon as the person fixes the field
panelsEl.addEventListener("input", (e) => {
  const box = e.target.closest(".field");
  if (box) box.classList.remove("invalid");
});

buildUI();
showStep(0);
</script>
</body>
</html>
